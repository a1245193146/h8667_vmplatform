---
# deploy_rule.yml — 在目标主机创建/幂等更新 AUTO-ITOPS- 前缀防火墙规则
# 对应脚本: firewall/powershell/New-FwRule.ps1
# 用法: ansible-playbook firewall/ansible/deploy_rule.yml -e target_host=x.x.x.x -e rule_json='{"rule_name":"AUTO-ITOPS-...",...}'
# 输出: ps1 的单行 JSON 原样打印到 stdout
# 作者: AUTO-GENERATED (Agent B - firewall automation module)

- name: Deploy firewall rule
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    # PowerShell 脚本目录：默认 <playbook目录>/../powershell，可用 -e ps_dir= 覆盖。
    # 注意不能命名为 ps_dir 再引用自身（Ansible 惰性模板会递归），故用 ps_dir_resolved。
    ps_dir_resolved: "{{ ps_dir | default(playbook_dir ~ '/../powershell', true) }}"
  tasks:
    - name: Check New-FwRule.ps1 exists on Ansible controller
      stat:
        path: "{{ ps_dir_resolved }}/New-FwRule.ps1"
      delegate_to: localhost
      become: false
      register: ps_stat_new_fwrule

    - name: Fail clearly when New-FwRule.ps1 missing
      fail:
        msg: "Ansible 控制器上找不到脚本 {{ ps_dir_resolved }}/New-FwRule.ps1 ，请把仓库 firewall/powershell/ 目录放到该位置，或用 -e ps_dir= 指定脚本目录"
      when: not ps_stat_new_fwrule.stat.exists

    - name: Ensure AUTO-ITOPS temp dir exists on target
      win_file:
        path: C:\Windows\Temp\AUTO-ITOPS
        state: directory

    - name: Copy New-FwRule.ps1 to target
      win_copy:
        src: "{{ ps_dir_resolved }}/New-FwRule.ps1"
        dest: C:\Windows\Temp\AUTO-ITOPS\New-FwRule.ps1

    - name: Run New-FwRule.ps1
      win_shell: >-
        powershell -NoProfile -ExecutionPolicy Bypass
        -File C:\Windows\Temp\AUTO-ITOPS\New-FwRule.ps1
        -RuleJson '{{ rule_json }}'
      register: result

    - name: Print JSON result
      debug:
        var: result.stdout
