---
# collect_connections.yml — 采集目标 Windows 主机活动 TCP/UDP 连接
# 对应脚本: firewall/powershell/Collect-FwConnections.ps1
# 用法: ansible-playbook firewall/ansible/collect_connections.yml -e target_host=x.x.x.x
# 输出: ps1 的单行 JSON 原样打印到 stdout
# 作者: AUTO-GENERATED (Agent B - firewall automation module)

- name: Collect firewall connections
  hosts: "{{ target_host }}"
  gather_facts: false
  tasks:
    - name: Copy Collect-FwConnections.ps1 to target
      win_copy:
        src: ../powershell/Collect-FwConnections.ps1
        dest: C:\Windows\Temp\AUTO-ITOPS\Collect-FwConnections.ps1

    - name: Run Collect-FwConnections.ps1
      win_shell: powershell -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Temp\AUTO-ITOPS\Collect-FwConnections.ps1
      register: result

    - name: Print JSON result
      debug:
        var: result.stdout
