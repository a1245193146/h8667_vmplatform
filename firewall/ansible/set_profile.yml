---
# set_profile.yml — 设置目标主机防火墙 Profile 启用状态（启用前自动做防自锁保护）
# 对应脚本: firewall/powershell/Set-FwProfileState.ps1（依赖同目录 Protect-ManagementAccess.ps1）
# 用法: ansible-playbook firewall/ansible/set_profile.yml -e target_host=x.x.x.x -e profile=All -e fw_enabled=true -e ansible_ip=10.0.0.2
# 输出: ps1 的单行 JSON 原样打印到 stdout
# 作者: AUTO-GENERATED (Agent B - firewall automation module)

- name: Set firewall profile state
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    # PowerShell 脚本目录：默认 <playbook目录>/../powershell，可用 -e ps_dir= 覆盖。
    # 注意不能命名为 ps_dir 再引用自身（Ansible 惰性模板会递归），故用 ps_dir_resolved。
    ps_dir_resolved: "{{ ps_dir | default(playbook_dir ~ '/../powershell', true) }}"
  tasks:
    - name: Check Set-FwProfileState.ps1 exists on Ansible controller
      stat:
        path: "{{ ps_dir_resolved }}/Set-FwProfileState.ps1"
      delegate_to: localhost
      become: false
      register: ps_stat_set_fwprofilestate

    - name: Fail clearly when Set-FwProfileState.ps1 missing
      fail:
        msg: "Ansible 控制器上找不到脚本 {{ ps_dir_resolved }}/Set-FwProfileState.ps1 ，请把仓库 firewall/powershell/ 目录放到该位置，或用 -e ps_dir= 指定脚本目录"
      when: not ps_stat_set_fwprofilestate.stat.exists

    - name: Copy Set-FwProfileState.ps1 to target
      win_copy:
        src: "{{ ps_dir_resolved }}/Set-FwProfileState.ps1"
        dest: C:\Windows\Temp\AUTO-ITOPS\Set-FwProfileState.ps1

    - name: Check Protect-ManagementAccess.ps1 exists on Ansible controller
      stat:
        path: "{{ ps_dir_resolved }}/Protect-ManagementAccess.ps1"
      delegate_to: localhost
      become: false
      register: ps_stat_protect_managementaccess

    - name: Fail clearly when Protect-ManagementAccess.ps1 missing
      fail:
        msg: "Ansible 控制器上找不到脚本 {{ ps_dir_resolved }}/Protect-ManagementAccess.ps1 ，请把仓库 firewall/powershell/ 目录放到该位置，或用 -e ps_dir= 指定脚本目录"
      when: not ps_stat_protect_managementaccess.stat.exists

    - name: Copy Protect-ManagementAccess.ps1 to target (dependency)
      win_copy:
        src: "{{ ps_dir_resolved }}/Protect-ManagementAccess.ps1"
        dest: C:\Windows\Temp\AUTO-ITOPS\Protect-ManagementAccess.ps1

    - name: Run Set-FwProfileState.ps1
      win_shell: >-
        powershell -NoProfile -ExecutionPolicy Bypass
        -File C:\Windows\Temp\AUTO-ITOPS\Set-FwProfileState.ps1
        -Profile {{ profile | default('All') }}
        -Enabled ${{ fw_enabled | default(true) | bool }}
        -AnsibleIP {{ ansible_ip }}
      register: result

    - name: Print JSON result
      debug:
        var: result.stdout
