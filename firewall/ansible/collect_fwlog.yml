---
# collect_fwlog.yml — 增量读取目标 Windows 主机 pfirewall.log
# 对应脚本: firewall/powershell/Read-FwLog.ps1
# 用法: ansible-playbook firewall/ansible/collect_fwlog.yml -e target_host=x.x.x.x -e offset=0 -e max_lines=2000
# 输出: ps1 的单行 JSON 原样打印到 stdout
# 作者: AUTO-GENERATED (Agent B - firewall automation module)

- name: Collect firewall log tail
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    # PowerShell 脚本目录：默认 <playbook目录>/../powershell，可用 -e ps_dir= 覆盖。
    # 注意不能命名为 ps_dir 再引用自身（Ansible 惰性模板会递归），故用 ps_dir_resolved。
    ps_dir_resolved: "{{ ps_dir | default(playbook_dir ~ '/../powershell', true) }}"
  tasks:
    - name: Check Read-FwLog.ps1 exists on Ansible controller
      stat:
        path: "{{ ps_dir_resolved }}/Read-FwLog.ps1"
      delegate_to: localhost
      become: false
      register: ps_stat_read_fwlog

    - name: Fail clearly when Read-FwLog.ps1 missing
      fail:
        msg: "Ansible 控制器上找不到脚本 {{ ps_dir_resolved }}/Read-FwLog.ps1 ，请把仓库 firewall/powershell/ 目录放到该位置，或用 -e ps_dir= 指定脚本目录"
      when: not ps_stat_read_fwlog.stat.exists

    - name: Copy Read-FwLog.ps1 to target
      win_copy:
        src: "{{ ps_dir_resolved }}/Read-FwLog.ps1"
        dest: C:\Windows\Temp\AUTO-ITOPS\Read-FwLog.ps1

    - name: Run Read-FwLog.ps1
      win_shell: >-
        powershell -NoProfile -ExecutionPolicy Bypass
        -File C:\Windows\Temp\AUTO-ITOPS\Read-FwLog.ps1
        -Offset {{ offset | default(0) }}
        -MaxLines {{ max_lines | default(2000) }}
      register: result

    - name: Print JSON result
      debug:
        var: result.stdout
